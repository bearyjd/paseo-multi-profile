name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Mobile safety audit
        # Client code must use React Native primitives only: no DOM globals or HTML-isms.
        run: |
          if grep -rnE 'document\.|window\.|localStorage|navigator\.|className=|onClick=' client/; then
            echo "::error::DOM or HTML usage found in client/ (plugins must run on mobile)"
            exit 1
          fi

      - name: Manifest sanity
        run: node -e "const m=require('./paseo-plugin.json'); if(!m.id||!m.requirements||!m.requirements.paseo){console.error('paseo-plugin.json needs id and requirements.paseo');process.exit(1)}"
